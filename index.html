<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <meta name="description" content="Bra Size Calculator">

    <!-- Bootstrap core CSS -->

    <!-- Flattr Code -->

    /* <![CDATA[ */

  <body>
    <div class="container">

      <div class="page-header">
        <h1>Magic Bra Size Calculator</h1>
      </div>

      <div class="row">
        <div class="col-md-4">
          <form id="braCalculator" target="#here">

          <div class="form-group">
            <label for="underbust">Underbust</label>
            <input type="number" class="form-control input-lg" id="underbust" placeholder="80">
          </div>
          <div class="form-group">
            <label for="bust">Bust</label>
            <input type="number" class="form-control input-lg" id="bust" placeholder="93">
          </div>
          <button id="calc" class="btn btn-primary btn-block">Calculate</button>
        </form>

        </div>
        <div class="col-md-1">
        </div>
        <div class="col-md-4">
            <h1><span id="ukSize"><small>UK</small> xx X</span></h1>
            <h1><span id="deSize"><small>DE</small> xx X</span></h1>
        </div>
        <div class="col-md-1">
        </div>
        <div class="col-md-3">
          <!-- Button trigger modal -->
          
          <h3>FAQ</h3>
          <a data-toggle="modal" data-target="#faq_1">Question 1</a><br>
          <a data-toggle="modal" data-target="#faq_2">Question 2</a>
          
          <h3>Support</h3>
          <!-- Flattr Button -->
          <a class="FlattrButton" style="display:none;"

              data-flattr-uid="mademoisellechaos"
              data-flattr-tags="opensource"
              data-flattr-category="software"
              href="http://bra.detmud.me">

          <br>
          
          <iframe src="https://ghbtns.com/github-btn.html?user=aytvill&repo=bra-calculator&type=fork"
          allowtransparency="true" frameborder="0" scrolling="0" width="53" height="20"></iframe>
          
        </div>
      </div>

      <hr>
      <p class="text-center">by <a href="https://twitter.com/detmud" target="_blank">@Detmud</a> & <a href="https://twitter.com/mamsellchaos">@MamsellChaos</a></p>
      <p class="text-center">Version 0.3.1</p>
    </div> <!-- /container -->

    <!-- Modal: FAQ; 1-->
    <div class="modal fade" id="faq_1" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>

          </div>
